name: Trigger Vercel Redeploy

on:
  push:
    paths-ignore:
      - 'deployment-triggers/vercel-redeploy.txt'

permissions:
  contents: write

jobs:
  trigger-vercel-redeploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize triggering actor
        id: actor
        run: echo "value=${GITHUB_ACTOR,,}" >> "$GITHUB_OUTPUT"

      - name: Update the tracked redeploy marker
        if: steps.actor.outputs.value == 'guesswho' || contains(steps.actor.outputs.value, 'copilot')
        run: |
          mkdir -p deployment-triggers
          {
            echo "Last Vercel redeploy trigger: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Source actor: ${{ github.actor }}"
            echo "Source branch: ${{ github.ref_name }}"
            echo "Source commit: ${{ github.sha }}"
          } > deployment-triggers/vercel-redeploy.txt

      - name: Commit and push the redeploy marker
        if: steps.actor.outputs.value == 'guesswho' || contains(steps.actor.outputs.value, 'copilot')
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add deployment-triggers/vercel-redeploy.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: trigger vercel redeploy"
          git push
